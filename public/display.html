<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%20100%20100%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20role%3D%22img%22%20aria-label%3D%22Noemy%20Studio%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22nsBg%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23e6f7f3%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23fce8ec%22%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%22nsHair%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%235eead4%22%2F%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%2314b8a6%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230d9488%22%2F%3E%3C%2FlinearGradient%3E%3CclipPath%20id%3D%22nsClip%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2250%22%2F%3E%3C%2FclipPath%3E%3C%2Fdefs%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2250%22%20fill%3D%22url(%23nsBg)%22%2F%3E%3Cg%20clip-path%3D%22url(%23nsClip)%22%3E%3Cpath%20d%3D%22M47%2022C42%2024%2039%2030%2039%2036C39%2038%2038%2040%2036.5%2042L32.5%2048.5C32%2049.5%2033%2050.5%2034.5%2050.5L36%2050.8C35.6%2052%2035.8%2053%2036.6%2053.4C35.8%2054.2%2035.9%2055.6%2037%2056.2C37.5%2057%2037.4%2058%2038.2%2059C38%2061%2038.6%2063.5%2040.5%2064.5C43%2065.5%2046%2065%2047.5%2064.5L48%2076C46%2082%2038%2088%2028%2092L20%20104L62%20104L62%2026Z%22%20fill%3D%22%23115e59%22%2F%3E%3Cpath%20d%3D%22M47%2022C50%2014%2060%2010%2070%2013C82%2017%2088%2030%2085%2042C83%2050%2088%2056%2087%2064C86%2072%2080%2076%2082%2084C84%2092%2080%2098%2076%20104L50%20104C56%2096%2058%2088%2057%2080C56%2072%2058%2066%2058%2060C58%2050%2054%2042%2052%2034C51%2029%2049%2025%2047%2022Z%22%20fill%3D%22url(%23nsHair)%22%2F%3E%3Cpath%20d%3D%22M49%2020.5C43.5%2021.5%2040%2026.5%2040.5%2031.5C44%2027%2050%2024.8%2057%2026.5C55%2022.5%2052%2020.5%2049%2020.5Z%22%20fill%3D%22url(%23nsHair)%22%2F%3E%3Cpath%20d%3D%22M60%2016C73%2018%2080%2029%2078%2041C76%2051%2082%2059%2080%2069C79%2078%2075%2086%2077%2097%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221%22%20stroke-linecap%3D%22round%22%20opacity%3D%22.55%22%2F%3E%3Cpath%20d%3D%22M55%2023C64%2027%2068%2036%2066.5%2046C65%2056%2070%2064%2068%2076C67%2084%2064%2090%2065%2098%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%22.8%22%20stroke-linecap%3D%22round%22%20opacity%3D%22.4%22%2F%3E%3Cpath%20d%3D%22M40.2%2041.2q2.2%201.5%204.6%20.3%22%20fill%3D%22none%22%20stroke%3D%22%23e6f7f3%22%20stroke-width%3D%221%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M22%2026l1.2%203.3%203.3%201.2-3.3%201.2-1.2%203.3-1.2-3.3-3.3-1.2%203.3-1.2Z%22%20fill%3D%22%23f4a7b9%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<title>Noemy Studio · Pantalla</title>
<style>
  :root {
    --bg: #fbf9f7; --surface: #ffffff; --surface-2: #f6f9f8; --border: #e6ecea;
    --text: #2b3a3a; --muted: #7d8c8b;
    --accent: #14b8a6; --accent-strong: #0d9488; --accent-deep: #0f766e; --accent-soft: #e6f7f3;
    --blush: #fce8ec; --blush-strong: #d9738c;
    --ok-bg: #e3f6ec; --ok: #2f8f63; --warn-bg: #fdf3e1; --warn: #a86a17;
    --shadow: 0 1em 2.6em rgba(15, 118, 110, .07);
    --serif: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #eaf8f5 0%, var(--bg) 45%, #fdf1f4 100%);
    color: var(--text); overflow: hidden; font-size: clamp(13px, 1.25vw, 26px);
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.3fr); gap: 1.6em; padding: 1.6em;
  }

  /* Bienvenida + QR */
  aside {
    background: var(--surface); border: 1px solid var(--border); border-radius: 1.6em; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 2em 1.6em; position: relative; overflow: hidden;
  }
  aside::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 38%; background: linear-gradient(180deg, var(--accent-soft), transparent); }
  aside > * { position: relative; }
  .logo { width: 7.5em; height: 7.5em; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 .35em #fff, 0 .8em 2.2em rgba(20, 184, 166, .25); }
  .logo svg { width: 100%; height: 100%; display: block; }
  .eyebrow { margin-top: 1.4em; font-size: .75em; letter-spacing: .34em; text-transform: uppercase; color: var(--accent-strong); }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 2.3em; letter-spacing: .02em; margin: .2em 0 .3em; }
  .tagline { font-family: var(--serif); font-style: italic; font-size: 1.25em; color: var(--blush-strong); }
  .divider { width: 3em; height: 1px; background: var(--accent); opacity: .5; margin: 1.2em auto; }
  .qr-frame { padding: .7em; background: #fff; border-radius: 1.1em; border: 1px solid var(--border); box-shadow: 0 .5em 1.5em rgba(15, 118, 110, .1); }
  .qr-frame img { display: block; width: 10em; height: 10em; }
  .scan { margin-top: 1em; font-size: 1em; font-weight: 600; }
  .scan-sub { color: var(--muted); font-size: .85em; margin-top: .3em; line-height: 1.45; }

  /* Lado derecho */
  .right { display: flex; flex-direction: column; gap: 1.2em; min-height: 0; }
  .topbar { display: flex; gap: 1em; align-items: stretch; }
  .stat { flex: 1; border-radius: 1em; padding: .8em 1.1em; border: 1px solid var(--border); background: var(--surface); }
  .stat span { display: block; color: var(--muted); font-size: .7em; text-transform: uppercase; letter-spacing: .14em; }
  .stat b { font-family: var(--serif); font-weight: 400; font-size: 1.9em; }
  .stat.w { background: var(--warn-bg); border-color: #f5e3c2; } .stat.w b { color: var(--warn); }
  .stat.s { background: var(--ok-bg); border-color: #c9ecd9; } .stat.s b { color: var(--ok); }
  .stat.c { background: var(--accent-soft); border-color: #c8ece4; } .stat.c b { color: var(--accent-deep); }
  .stat.a { background: var(--blush); border-color: #f6d3db; } .stat.a b { color: var(--blush-strong); }
  .clock { display: grid; place-items: center; padding: 0 .6em; font-family: var(--serif); font-size: 2.3em; color: var(--accent-deep); font-variant-numeric: tabular-nums; }

  main { flex: 1; display: grid; grid-template-columns: 1fr 1.15fr; gap: 1.2em; min-height: 0; }
  section { background: var(--surface); border: 1px solid var(--border); border-radius: 1.4em; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  section h2 { font-family: var(--serif); font-weight: 400; font-size: 1.35em; padding: .85em 1.2em; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: .6em; }
  .dot { width: .6em; height: .6em; border-radius: 50%; }
  .serving .dot { background: var(--ok); animation: blink 1.6s infinite; }
  .waiting .dot { background: #e9b45c; }
  @keyframes blink { 50% { opacity: .3; } }
  .list { flex: 1; overflow: hidden; padding: .7em; }
  .item { display: flex; align-items: center; gap: 1em; padding: .85em 1em; border-radius: 1em; margin-bottom: .5em; animation: rise .45s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .serving .item { background: var(--ok-bg); border: 1px solid #c9ecd9; }
  .serving .item .name { font-family: var(--serif); font-size: 1.9em; font-weight: 400; }
  .waiting .item { background: var(--surface-2); }
  .waiting .item:first-child { background: var(--accent-soft); border: 1px solid #c8ece4; }
  .pos { min-width: 2.2em; height: 2.2em; border-radius: 50%; background: #fff; color: var(--accent-deep); display: grid; place-items: center; font-weight: 600; font-size: 1.05em; border: 1px solid var(--border); }
  .serving .pos { color: var(--ok); border-color: #c9ecd9; }
  .name { flex: 1; font-size: 1.4em; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: .85em; text-align: right; white-space: nowrap; line-height: 1.4; }
  .empty { height: 100%; display: grid; place-items: center; color: var(--muted); font-size: 1.15em; font-style: italic; text-align: center; padding: 1em; }
  .more { text-align: center; color: var(--muted); padding: .4em; font-size: .9em; }

  @media (max-width: 860px) {
    body { overflow: auto; grid-template-columns: 1fr; font-size: 14px; padding: 16px; height: auto; }
    .topbar { flex-wrap: wrap; } .stat { min-width: 45%; } .clock { display: none; }
    main { grid-template-columns: 1fr; }
    section { min-height: 200px; }
  }
</style>
</head>
<body>
<aside>
  <div class="logo"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Noemy Studio"><defs><linearGradient id="nsBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f7f3"/><stop offset="1" stop-color="#fce8ec"/></linearGradient><linearGradient id="nsHair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset=".55" stop-color="#14b8a6"/><stop offset="1" stop-color="#0d9488"/></linearGradient><clipPath id="nsClip"><circle cx="50" cy="50" r="50"/></clipPath></defs><circle cx="50" cy="50" r="50" fill="url(#nsBg)"/><g clip-path="url(#nsClip)"><path d="M47 22C42 24 39 30 39 36C39 38 38 40 36.5 42L32.5 48.5C32 49.5 33 50.5 34.5 50.5L36 50.8C35.6 52 35.8 53 36.6 53.4C35.8 54.2 35.9 55.6 37 56.2C37.5 57 37.4 58 38.2 59C38 61 38.6 63.5 40.5 64.5C43 65.5 46 65 47.5 64.5L48 76C46 82 38 88 28 92L20 104L62 104L62 26Z" fill="#115e59"/><path d="M47 22C50 14 60 10 70 13C82 17 88 30 85 42C83 50 88 56 87 64C86 72 80 76 82 84C84 92 80 98 76 104L50 104C56 96 58 88 57 80C56 72 58 66 58 60C58 50 54 42 52 34C51 29 49 25 47 22Z" fill="url(#nsHair)"/><path d="M49 20.5C43.5 21.5 40 26.5 40.5 31.5C44 27 50 24.8 57 26.5C55 22.5 52 20.5 49 20.5Z" fill="url(#nsHair)"/><path d="M60 16C73 18 80 29 78 41C76 51 82 59 80 69C79 78 75 86 77 97" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity=".55"/><path d="M55 23C64 27 68 36 66.5 46C65 56 70 64 68 76C67 84 64 90 65 98" fill="none" stroke="#fff" stroke-width=".8" stroke-linecap="round" opacity=".4"/><path d="M40.2 41.2q2.2 1.5 4.6 .3" fill="none" stroke="#e6f7f3" stroke-width="1" stroke-linecap="round"/><path d="M22 26l1.2 3.3 3.3 1.2-3.3 1.2-1.2 3.3-1.2-3.3-3.3-1.2 3.3-1.2Z" fill="#f4a7b9"/></g></svg></div>
  <div class="eyebrow">Te damos la bienvenida a</div>
  <h1>Noemy Studio</h1>
  <p class="tagline">Donde tu belleza comienza</p>
  <div class="divider"></div>
  <div class="qr-frame"><img id="qrImg" alt="Código QR para unirse a la lista"></div>
  <p class="scan">Escanea y reserva tu lugar</p>
  <p class="scan-sub">Usa la cámara de tu teléfono.<br>Te avisaremos cuando sea tu turno.</p>
</aside>

<div class="right">
  <div class="topbar">
    <div class="stat w"><span>En espera</span><b id="sWaiting">0</b></div>
    <div class="stat s"><span>Atendiendo</span><b id="sServing">0</b></div>
    <div class="stat c"><span>Completados</span><b id="sDone">0</b></div>
    <div class="stat a"><span>Espera promedio</span><b id="sAvg">0 min</b></div>
    <div class="clock" id="clock">--:--</div>
  </div>

  <main>
    <section class="serving">
      <h2><span class="dot"></span> Atendiendo ahora</h2>
      <div class="list" id="servingList"></div>
    </section>
    <section class="waiting">
      <h2><span class="dot"></span> En espera</h2>
      <div class="list" id="waitingList"></div>
    </section>
  </main>
</div>

<script>
  const $ = id => document.getElementById(id);
  const MAX_WAITING = 8;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const mins = ms => Math.max(0, Math.floor(ms / 60000));
  const people = n => n + (n === 1 ? ' persona' : ' personas');
  // Muestra solo el primer nombre + inicial del apellido por privacidad
  const shortName = n => { const p = String(n).trim().split(/\s+/); return p.length > 1 ? p[0] + ' ' + p[1][0] + '.' : p[0]; };

  let lastKey = '';

  function tick() {
    $('clock').textContent = new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  }

  async function refresh() {
    try {
      const { waiting, serving, stats } = await (await fetch('/api/queue')).json();
      $('sWaiting').textContent = stats.waiting;
      $('sServing').textContent = stats.serving;
      $('sDone').textContent = stats.completed;
      $('sAvg').textContent = stats.avgWaitMinutes + ' min';

      // Solo redibuja si algo cambió (evita reiniciar animaciones), salvo los minutos
      const now = Date.now();
      const key = JSON.stringify([waiting.map(e => e.id), serving.map(e => e.id), Math.floor(now / 60000)]);
      if (key === lastKey) return;
      lastKey = key;

      $('servingList').innerHTML = serving.length
        ? serving.map(e => `<div class="item">
            <div class="pos">✦</div>
            <div class="name">${esc(shortName(e.name))}</div>
            <div class="meta">${people(e.partySize)}</div>
          </div>`).join('')
        : '<div class="empty">Nadie en atención por ahora</div>';

      const shown = waiting.slice(0, MAX_WAITING);
      $('waitingList').innerHTML = waiting.length
        ? shown.map((e, i) => `<div class="item">
            <div class="pos">${i + 1}</div>
            <div class="name">${esc(shortName(e.name))}</div>
            <div class="meta">${people(e.partySize)}<br>${mins(now - e.joinedAt)} min</div>
          </div>`).join('') + (waiting.length > MAX_WAITING ? `<div class="more">+ ${waiting.length - MAX_WAITING} más en espera</div>` : '')
        : '<div class="empty">No hay espera en este momento.<br>Escanea el código y reserva tu lugar.</div>';
    } catch (e) { /* reintenta en el próximo ciclo */ }
  }

  fetch('/api/qr').then(r => r.json()).then(d => { $('qrImg').src = d.dataUrl; }).catch(() => {});
  tick(); setInterval(tick, 1000);
  refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
